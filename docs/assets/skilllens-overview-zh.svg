<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc" lang="zh">
<title id="title">SkillLens — Skill 文件检查</title>
<desc id="desc">SkillLens 工作流程：指定目录，检查元数据、重名、重复入口和本地链接，再查看问题、位置与建议。</desc>
