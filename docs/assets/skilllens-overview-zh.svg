<text x="66" y="191" font-size="50" fill="#172D2C" font-weight="650" letter-spacing="-1.4">Skill 文件检查</text>
<text x="68" y="236" font-size="22" fill="#5F7069" font-weight="400" >选好目录，检查文件，再看问题出在哪里。</text>
